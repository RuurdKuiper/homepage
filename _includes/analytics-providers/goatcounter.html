{% if jekyll.environment == "production" and site.analytics.goatcounter.endpoint %}
<script>
  (function () {
    // Keep local builds, alternate hosts, and design previews out of the statistics.
    if (window.location.hostname !== 'ruurdkuiper.com' && window.location.hostname !== 'www.ruurdkuiper.com') return;
    if (window.location.pathname.indexOf('/preview/') === 0) return;

    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://gc.zgo.at/count.js';
    script.setAttribute('data-goatcounter', {{ site.analytics.goatcounter.endpoint | jsonify }});
    document.body.appendChild(script);
  }());
</script>
{% endif %}
